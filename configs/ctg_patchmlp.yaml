# configs/patch_mlp.yaml
# python run.py --config configs/patch_mlp.yaml
#
# patch_len guide (at 4 Hz, 4 pts = 1 s) for seq_len=2400 (10 min):
#   [600, 300, 150, 60]  →  2.5 min / 75 s / 37.5 s / 15 s
#   Coarsest scale (600) = half the 10-min window — captures full baseline shifts.
#   Finest scale (60)    = 15 s — resolves individual decelerations.

model:        "PatchMLP"
in_channels:  2             # FHR + TOCO in this dataset
enc_in:       2             # must match in_channels (used for channel-mixing MLP)
d_model:      64            # 512 is far too large for 1-channel + small dataset;
                            # 64 → ff1 has 4K params/layer, much safer
e_layers:     2             # number of Encoder (MLP-Mixer) blocks
use_norm:     true          # instance-normalise each channel over time
patch_len:    [600, 300, 150, 60]   # CTG-appropriate for 10-min windows at 4 Hz
dropout:      0.2

# ── data ─────────────────────────────────────────────────────────────────────
data:         "CTG"
root_path:    "./dataset/"
data_path:    "CTGMultiWindow.npz"
seq_len:      7200          # 30 min × 4 Hz
num_classes:  2
num_workers:  4

# ── cross-validation ─────────────────────────────────────────────────────────
n_folds:      5
seed:         42

# ── class imbalance ───────────────────────────────────────────────────────────
# Update focal_alpha once you know the positive rate: alpha ≈ 1 - (n_pos/n_total)
use_focal:    true
focal_alpha:  0.84          # placeholder — adjust after checking dataset balance
focal_gamma:  2.0

# ── training ──────────────────────────────────────────────────────────────────
train_epochs:  50
patience:      15           # bumped from 10; 10 is too short given noisy folds
batch_size:    32
learning_rate: 1.0e-4
weight_decay:  1.0e-3       # L2 regularization — important for small dataset