# configs/cnn_lstm.yaml
model:        "CNN_LSTM"
in_channels:  2
seq_len:      7200
lstm_hidden:  64
lstm_layers:  1
dropout:      0.3
use_focal:    true
focal_alpha:  0.85
focal_gamma:  2.0
n_folds:      5
seed:         42
train_epochs: 100
patience:     20
batch_size:   32
learning_rate: 1.0e-4
weight_decay:  1.0e-3
data:         "CTG"
root_path:    "./dataset/"
data_path:    "CTG30minSegments.npz"
num_classes:  2
num_workers:  4
