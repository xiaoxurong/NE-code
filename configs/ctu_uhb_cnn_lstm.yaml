# configs/ctu_uhb_cnn_lstm.yaml
# CNN-LSTM on the public CTU-UHB data. Build the window file first:
#   python scripts/prepare_ctu_uhb.py --wfdb_dir data/ctu-uhb --download
# If you change --window_min, --ph_threshold or --no_mask_channels there, pass the
# matching --data_path, --seq_len and --in_channels/--enc_in (the script prints them).

model:         "CNN_LSTM"
data:          "CTG"
root_path:     "./dataset/"
data_path:     "ctu_uhb_stage1_end_w30m_n1_v0.2_ph7.05.npz"
seq_len:       7200          # 30 min at 4 Hz
in_channels:   4             # FHR, UC, and their observed-masks
enc_in:        4
num_classes:   2

lstm_hidden:   64
lstm_layers:   1
dropout:       0.3

# class imbalance: BCE with the positive class weighted by n_negative / n_positive of each
# fold's training labels, so the weight follows the label threshold. (A fixed focal alpha
# tuned for one prevalence made the model collapse at pH < 7.15; see ctu_uhb_cnn_lstm_focal.yaml.)
use_focal:     false
pos_weight:    "auto"

# keep the checkpoint with the best validation AUROC (validation loss barely moves on
# imbalanced data and tended to keep an early, near-constant model)
early_stop_metric: "auroc"

n_folds:       5
n_repeats:     5             # repeated CV; use --only_repeat r to run repeats as separate jobs
fold_seed:     42
seed:          42
train_epochs:  100
patience:      20
batch_size:    32
learning_rate: 1.0e-4
weight_decay:  1.0e-3
num_workers:   4
